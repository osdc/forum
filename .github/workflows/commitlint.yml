name: Commitlint

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # creates a unique group (e.g. Commitlint-refs/heads/main)
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }} # prevents cancellations on deployments to main

jobs:
  commitlint:
    name: Commitlint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # By default, `actions/checkout` only fetches the single latest commit

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

        # Standard current commit validation as per Commitlint docs
      - name: Validate current commit with commitlint
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

        # Standard PR commit validation as per Commitlint docs
      - name: Validate PR commits with commitlint
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
